name: Build runtime

on:
  schedule:
    # Every 6 hours. Checks npm and does nothing unless @deepseek-ai/dsh has a new version.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      harness_version:
        description: "@deepseek-ai/dsh version or npm dist-tag (default latest)"
        required: false
        default: latest
      rebuild:
        description: "Build even if a release already carries this harness version"
        type: boolean
        default: false
      release_id:
        description: "Release tag (empty: UTC date plus the next free number that day, for example 2026.11.14-7)"
        required: false
        default: ""
      min_app_version:
        description: "Lowest DSH Mobile versionName that may install this bundle (empty: same as the previous release)"
        required: false
        default: ""
      dry_run:
        description: "Build and check everything, but do not publish a release"
        type: boolean
        default: false
      report_failures:
        description: "Open or update a GitHub issue if this build fails (scheduled runs always do)"
        type: boolean
        default: false
      simulate_failure:
        description: "Test only: fail on purpose (early: before any build job, late: after signing, just before publishing)"
        type: choice
        options: [none, early, late]
        default: none

permissions:
  contents: read

# One run at a time for the whole workflow: a check, a build and a publish never overlap,
# so two runs can never build the same version at once. Queued runs wait, they are not cancelled.
concurrency:
  group: runtime-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check npm and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      harness_version: ${{ steps.plan.outputs.harness_version }}
      release_id: ${{ steps.plan.outputs.release_id }}
      min_app_version: ${{ steps.plan.outputs.min_app_version }}
      node_version: ${{ steps.plan.outputs.node_version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HARNESS_INPUT: ${{ inputs.harness_version }}
          RELEASE_INPUT: ${{ inputs.release_id }}
          MIN_APP_INPUT: ${{ inputs.min_app_version }}
          REBUILD: ${{ inputs.rebuild }}
          DRY_RUN: ${{ inputs.dry_run }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          AUTO_RELEASE: ${{ vars.RUNTIME_AUTO_RELEASE }}
        run: bash scripts/plan-release.sh

  proot-android:
    name: proot for Android
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Android NDK
        run: |
          set -euo pipefail
          . scripts/versions.env
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          ls "$SDK/ndk" || true
          if [ ! -d "$SDK/ndk/$NDK_VERSION" ]; then
            # yes(1) dies of SIGPIPE when sdkmanager exits; that is not an error.
            set +o pipefail
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
            set -o pipefail
          fi
          test -x "$SDK/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build proot and loader (arm64-v8a, x86_64)
        run: bash scripts/build-proot-android.sh out/proot-android
      - name: Check 16 KB alignment
        run: |
          set -euo pipefail
          O=out/proot-android
          python3 scripts/check-elf-alignment.py --machine aarch64 --min 16384 --strict --json "$RUNNER_TEMP/a64.json" \
            $O/android-arm64-v8a-libproot.so $O/android-arm64-v8a-libproot-loader.so
          python3 scripts/check-elf-alignment.py --machine x86_64 --min 16384 --strict --json "$RUNNER_TEMP/x64.json" \
            $O/android-x86_64-libproot.so $O/android-x86_64-libproot-loader.so
          for f in $O/*.so; do echo "== $f"; readelf -lW "$f" | grep -E 'LOAD|GNU_STACK'; done
          python3 - "$RUNNER_TEMP/a64.json" "$RUNNER_TEMP/x64.json" "$O/proot-android.json" <<'EOF'
          import json, sys
          a, b = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          assert a["checked"] == 2 and b["checked"] == 2, "expected two ELF files per ABI"
          n, t = a["aligned"] + b["aligned"], a["checked"] + b["checked"]
          json.dump({"alignmentSummary": f"{n} of {t} files aligned to 16 KB or more",
                     "histogram": {"arm64-v8a": a["histogram"], "x86_64": b["histogram"]}},
                    open(sys.argv[3], "w"), indent=2)
          EOF
          cat $O/proot-android.json
          sha256sum $O/*
      - uses: actions/upload-artifact@v7
        with:
          name: proot-android
          path: out/proot-android
          if-no-files-found: error

  layers:
    name: Layers ${{ matrix.abi }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            runner: ubuntu-24.04-arm
          - abi: x86_64
            runner: ubuntu-24.04
    env:
      ABI: ${{ matrix.abi }}
      HARNESS_VERSION: ${{ needs.prepare.outputs.harness_version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      # The pinned Node.js, or a newer 24.x when the harness asks for one (see scripts/node-engine.mjs).
      NODE_VERSION: ${{ needs.prepare.outputs.node_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Disk space
        run: |
          df -h / "$RUNNER_TEMP"
          avail=$(df --output=avail -k / | tail -1)
          if [ "$avail" -lt 25000000 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
            df -h /
          fi
      - name: Linux proot for the smoke test (same commit)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libtalloc-dev zstd strace jq > /dev/null
          bash scripts/build-proot-linux.sh "$RUNNER_TEMP/proot-linux"
      - name: Build base and harness layers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/layers-work"
          docker run --rm --privileged \
            -v "$PWD:/src" -v "$RUNNER_TEMP/layers-work:/work" -w /src \
            -e HARNESS_VERSION -e RELEASE_ID -e NODE_VERSION \
            debian:trixie bash scripts/build-layers.sh "$ABI" "out/layers-$ABI"
          sudo chown -R "$(id -u):$(id -g)" out
          sudo rm -rf "$RUNNER_TEMP/layers-work"
      - name: Smoke test under proot
        run: |
          WORK="$RUNNER_TEMP/smoke" bash scripts/smoke-test.sh "$ABI" "out/layers-$ABI" "$RUNNER_TEMP/proot-linux" \
            "out/layers-$ABI/smoke-$ABI.json"
      - name: Summary
        if: always()
        run: |
          {
            echo "### $ABI"
            if [ -f "out/layers-$ABI/smoke-$ABI.json" ]; then
              echo
              echo "| Start to readiness (proot, median of 3) | Pack on | Pack off | Path syscalls on / off |"
              echo "|---|---|---|---|"
              jq -r '.modulePack | "| first start after extraction: \(.packOn.startSeconds[0]) s | \(.packOn.medianSeconds) s | \(.packOff.medianSeconds) s | \(.packOn.pathSyscalls // "n/a") / \(.packOff.pathSyscalls // "n/a") |"' "out/layers-$ABI/smoke-$ABI.json"
              echo
              jq -r '.modulePack | "Same JSON for \(.callsCompared) calls pack on vs off: \(.responsesIdenticalOnVsOff); degraded-pack cases passed: \(.degradedCasesPassed); module outside /opt/dsh read from disk: \(.outsideTreeModuleFromDisk)."' "out/layers-$ABI/smoke-$ABI.json"
            fi
            if [ -f "out/layers-$ABI/layers-$ABI.json" ]; then
              echo
              jq -r '"Dedupe: \(.dedupe.linkedCopies) copies became symlinks, \(.dedupe.filesSaved) files and \(.dedupe.bytesSaved / 1048576 | floor) MiB saved (installed tree: \(.dedupe.harnessFilesInstalled) files, \(.dedupe.harnessBytesInstalled / 1048576 | floor) MiB). Module pack: \(.modulePack.packBytes / 1048576 | floor) MiB, \(.modulePack.modules) modules, build \(.modulePack.buildId)."' "out/layers-$ABI/layers-$ABI.json"
            fi
            [ -f "out/layers-$ABI/layers-$ABI.json" ] && { echo '```json'; jq '{base: (.base | del(.stats)), harness: (.harness | del(.stats)), dedupe: (.dedupe | del(.groups)), modulePack, prune, alignment}' "out/layers-$ABI/layers-$ABI.json"; echo '```'; }
            [ -f "out/layers-$ABI/smoke-$ABI.json" ] && { echo '```json'; cat "out/layers-$ABI/smoke-$ABI.json"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        with:
          name: layers-${{ matrix.abi }}
          path: out/layers-${{ matrix.abi }}
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-logs-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/smoke/guest-checks.txt
            ${{ runner.temp }}/smoke/harness-redacted.log
          if-no-files-found: ignore

  release:
    name: Manifest and release
    needs: [prepare, proot-android, layers]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble manifest
        env:
          MIN_APP_VERSION: ${{ needs.prepare.outputs.min_app_version }}
          PREV_TAG: ${{ needs.prepare.outputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -laR artifacts
          KEY_ID=$(openssl pkey -pubin -in keys/runtime-signing-ed25519.pub.pem -outform DER | tail -c 32 | sha256sum | cut -c1-16)
          # Previous published release (if any): layer ids must not be reused for different content,
          # and the new manifest points back at it. Its manifest must verify against the pinned key.
          PREV=""
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$RELEASE_ID" ]; then
            mkdir -p previous
            gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --pattern manifest.json.sig --dir previous --clobber
            bash scripts/verify-manifest.sh previous/manifest.json previous/manifest.json.sig
            PREV=previous/manifest.json
            echo "previous release: $PREV_TAG (signature verified)"
          fi
          python3 scripts/assemble-release.py --artifacts artifacts --out release --release-id "$RELEASE_ID" \
            --min-app-version "$MIN_APP_VERSION" --repo "$GITHUB_REPOSITORY" --key-id "$KEY_ID" \
            ${PREV:+--previous-manifest "$PREV"}
      - name: Sign manifest
        env:
          RUNTIME_SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_KEY }}
        run: bash scripts/sign-manifest.sh release
      - name: Summary
        run: |
          cat release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          ls -la release
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: |
            release/manifest.json
            release/manifest.json.sig
            release/SHA256SUMS.txt
            release/release-notes.md
      - name: Simulated failure (test only)
        if: ${{ inputs.simulate_failure == 'late' }}
        run: |
          echo "::error title=Simulated failure::simulate_failure=late: every check passed and the manifest is signed; stopping before the release is created, on purpose."
          exit 1
      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s extglob
          gh release create "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Runtime $RELEASE_ID" --notes-file release/release-notes.md \
            release/!(release-notes.md)
          gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
      - name: Verify the published release from outside
        # Downloads the release like an app would, without a token. A release that does not
        # verify is deleted again, so a broken bundle never stays the latest one.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HERE=$PWD/scripts
          W=$(mktemp -d)
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error title=Published release did not verify::deleting release $RELEASE_ID and its tag"
              gh release delete "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            fi
            rm -rf "$W"
          }
          trap cleanup EXIT
          cd "$W"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_ID"
          get() { curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors -o "$2" "$1"; }
          get "$BASE/manifest.json" manifest.json
          get "$BASE/manifest.json.sig" manifest.json.sig
          get "$BASE/SHA256SUMS.txt" SHA256SUMS.txt
          bash "$HERE/verify-manifest.sh" manifest.json manifest.json.sig
          [ "$(jq -r .releaseId manifest.json)" = "$RELEASE_ID" ] || { echo "manifest has another releaseId"; exit 1; }
          awk '{print $2}' SHA256SUMS.txt | sed 's/^\*//' | while read -r f; do
            case "$f" in manifest.json|manifest.json.sig) continue ;; esac
            get "$BASE/$f" "$f"
          done
          sha256sum -c SHA256SUMS.txt
          # Every file the manifest names must be in SHA256SUMS.txt with the same hash and size.
          jq -r '[.archs[] | (.proot[], .layers[])] + .proot.sources | .[] | "\(.sha256)  \(.file) \(.size)"' manifest.json | while read -r h f size; do
            grep -q "^$h  $f\$" SHA256SUMS.txt || { echo "$f: hash in manifest.json is not in SHA256SUMS.txt"; exit 1; }
            [ "$(stat -c %s "$f")" = "$size" ] || { echo "$f: size differs from the manifest"; exit 1; }
          done
          # The pointer to the previous release must resolve to a manifest that verifies too.
          if jq -e .previous manifest.json >/dev/null; then
            PID=$(jq -r .previous.releaseId manifest.json); PURL=$(jq -r .previous.manifestUrl manifest.json)
            mkdir prev
            get "$PURL" prev/manifest.json
            get "${PURL%manifest.json}manifest.json.sig" prev/manifest.json.sig
            bash "$HERE/verify-manifest.sh" prev/manifest.json prev/manifest.json.sig
            [ "$(jq -r .releaseId prev/manifest.json)" = "$PID" ] || { echo "previous manifest has another releaseId"; exit 1; }
            [ "$(jq -r .harness.version prev/manifest.json)" = "$(jq -r .previous.harnessVersion manifest.json)" ] || { echo "previous harness version differs"; exit 1; }
            [ "$(jq -r .sequence prev/manifest.json)" = "$(jq -r .previous.sequence manifest.json)" ] || { echo "previous sequence differs"; exit 1; }
            [ "$(jq -r .sequence manifest.json)" -gt "$(jq -r .sequence prev/manifest.json)" ] || { echo "sequence did not increase"; exit 1; }
            echo "previous release $PID resolves and verifies"
          fi
          echo "release $RELEASE_ID verified from outside"

  report:
    name: Issue for a failed build
    needs: [prepare, proot-android, layers, release]
    # Only when a build was wanted. A quiet "nothing to do" run never gets here.
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_VERSION: ${{ needs.prepare.outputs.harness_version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RESULTS: "prepare=${{ needs.prepare.result }} proot-android=${{ needs.proot-android.result }} layers=${{ needs.layers.result }} release=${{ needs.release.result }}"
      RELEASE_RESULT: ${{ needs.release.result }}
      REPORT: ${{ github.event_name == 'schedule' || inputs.report_failures }}
      DRY_RUN: ${{ inputs.dry_run }}
      SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          TITLE="Automatic runtime build failed for @deepseek-ai/dsh $HARNESS_VERSION"
          LABEL=runtime-auto-release
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "results: $RESULTS"
          open_issues() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$LABEL" --limit 200 --json number,title \
              | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number'
          }
          if [ "$RELEASE_RESULT" = success ] && [ "$DRY_RUN" != true ]; then
            for n in $(open_issues); do
              gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Fixed: release \`$RELEASE_ID\` with harness $HARNESS_VERSION was published by [this run]($RUN_URL). Closing."
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed
              echo "closed issue #$n"
            done
            exit 0
          fi
          if [ "$RELEASE_RESULT" = success ]; then echo "dry run succeeded: nothing to report"; exit 0; fi
          case "$RESULTS" in *failure*) ;; *) echo "no failed job (results: $RESULTS): nothing to report"; exit 0 ;; esac
          if [ "$REPORT" != true ]; then echo "failure reporting is off for this run"; exit 0; fi
          JOBS=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name): \(.url)"')
          NOTE=""
          if [ -n "$SIMULATE_FAILURE" ] && [ "$SIMULATE_FAILURE" != none ]; then
            NOTE="

          This failure was simulated on purpose (simulate_failure=$SIMULATE_FAILURE)."
          fi
          BODY="The runtime build for \`@deepseek-ai/dsh@$HARNESS_VERSION\` (release id \`$RELEASE_ID\`) failed. **Nothing was published**; apps keep the current release.

          Run: $RUN_URL (trigger: $EVENT_NAME)

          Failed jobs:
          $JOBS$NOTE

          The next scheduled run tries again. This issue closes itself when a release with this harness version is published."
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Automatic runtime release failed" 2>/dev/null || true
          EXISTING=$(open_issues | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again. Run: $RUN_URL (trigger: $EVENT_NAME)"$'\n\n'"Failed jobs:"$'\n'"$JOBS$NOTE"
            echo "updated issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
